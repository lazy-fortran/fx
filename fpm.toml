name = "fx"
version = "0.1.0"
license = "MIT"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
description = "Shared Fortran infrastructure: string, JSON, cache, DAG, MCP, LSP"

[build]
auto-executables = true

[install]
library = true

[[executable]]
name = "fx-mcp-server"
source-dir = "app"
main = "fx_mcp_server.f90"

[[test]]
name = "test_fx_test"
main = "test_fx_test.f90"

[[test]]
name = "test_cache"
main = "test_cache.f90"

[[test]]
name = "test_lsp_did_change"
main = "test_lsp_did_change.f90"

[[test]]
name = "test_action_cache"
main = "test_action_cache.f90"

[[test]]
name = "test_cache_key_concurrent"
main = "test_cache_key_concurrent.f90"
