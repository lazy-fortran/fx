name = "fx"
version = "0.1.0"
license = "MIT"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
description = "Shared Fortran infrastructure: string, JSON, cache, DAG, MCP, LSP"

[build]
auto-executables = true

[install]
library = true

[dev-dependencies]
fx_mcp_test_os = { path = "test-support/fx_mcp_test_os" }
fx_test_fs = { path = "test-support/fx_test_fs" }

[[executable]]
name = "fx-mcp-server"
source-dir = "app"
main = "fx_mcp_server.f90"

[[test]]
name = "test_fx_test"
main = "test_fx_test.f90"

[[test]]
name = "test_cache"
main = "test_cache.f90"

[[test]]
name = "test_lsp_did_change"
main = "test_lsp_did_change.f90"

[[test]]
name = "test_action_cache"
main = "test_action_cache.f90"

[[test]]
name = "test_cache_key_concurrent"
main = "test_cache_key_concurrent.f90"

[[test]]
name = "test_immutable_store"
main = "test_immutable_store.f90"

[[test]]
name = "test_immutable_materialization_slow"
main = "test_immutable_materialization.f90"

[[test]]
name = "test_immutable_publication"
source-dir = "test"
main = "test_immutable_publication.f90"

[[test]]
name = "test_immutable_publication_race"
source-dir = "test"
main = "test_immutable_publication_race.f90"

[[test]]
name = "test_mcp_system"
source-dir = "test"
main = "test_mcp_system.f90"

[[test]]
name = "test_action_result_store"
source-dir = "test"
main = "test_action_result_store.f90"

[[test]]
name = "test_immutable_leases"
source-dir = "test"
main = "test_immutable_leases.f90"

[[test]]
name = "test_action_result_read_lease"
source-dir = "test"
main = "test_action_result_read_lease.f90"
