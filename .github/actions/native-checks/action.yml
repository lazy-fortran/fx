name: Native compiler checks
description: Run the shared Fx native authorities with the selected compiler.
inputs:
  compiler:
    description: Required Fortran compiler executable.
    required: true
runs:
  using: composite
  steps:
    - name: Install build tools
      shell: bash
      env:
        COMPILER: ${{ inputs.compiler }}
      run: |
        case "$COMPILER" in
          gfortran-12|gfortran-14|flang-21) ;;
          *) echo "unsupported compiler: $COMPILER" >&2; exit 2 ;;
        esac
        scratch_root=$(mktemp -d /var/tmp/fx-ci.XXXXXX)
        echo "TMPDIR=$scratch_root" >> "$GITHUB_ENV"
        if [ "$COMPILER" = flang-21 ]; then
          curl --fail --location https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' |
            sudo tee /etc/apt/sources.list.d/llvm.list
        fi
        sudo apt-get update
        if [ "$COMPILER" = flang-21 ]; then
          sudo apt-get install -y flang-21 libomp-21-dev gcc g++ curl
        else
          sudo apt-get install -y "$COMPILER" gcc g++ curl
        fi
        "$COMPILER" --version | head -1
    - name: Install fpm
      shell: bash
      run: |
        sudo curl --fail --location -o /usr/local/bin/fpm \
          https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
        sudo chmod +x /usr/local/bin/fpm
        fpm --version
    - name: Run native checks
      shell: bash
      env:
        COMPILER: ${{ inputs.compiler }}
      run: ci/run.sh ci-build-test "$COMPILER"
    - name: Remove test scratch
      if: always()
      shell: bash
      run: |
        case "${TMPDIR:-}" in
          /var/tmp/fx-ci.*) rm -rf -- "$TMPDIR" ;;
        esac
