name: CI

on:
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && fromJSON('["self-hosted","itp-slurm"]') || fromJSON('["self-hosted","itp-build"]') }}
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    steps:
      - name: Checkout fx
        uses: actions/checkout@v4

        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run native checks in the build container
        if: ${{ !github.event.pull_request.head.repo.fork && !(github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          ci/run.sh ci-build-test
      - name: Bundle exact sources for Slurm
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        env:
          SCI_TIER: ci-build-test
        run: |-
          TMPDIR="$RUNNER_TEMP" ci/bundle.sh "$RUNNER_TEMP/ci.tar.zst"
      - name: Run native checks on sCluster
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          sci-dispatch native "$RUNNER_TEMP/ci.tar.zst"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran-14 gcc-14 curl
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/gfortran gfortran /usr/bin/gfortran-14 100
          gcc --version | head -1
          gfortran --version | head -1

        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Install fpm
        run: |
          sudo curl -L -o /usr/local/bin/fpm \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          sudo chmod +x /usr/local/bin/fpm
          fpm --version

        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build fx
        run: fpm build

        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Test fx
        run: fpm test

        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Concurrent immutable initialization
        run: fpm test --target test_immutable_init_concurrent --flag "-fopenmp"

        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Optimized MCP parser and public process oracle
        run: |
          fpm build --flag "-O2 -fopenmp"
          fpm test --flag "-O2 -fopenmp" --target test_mcp
          fpm test --flag "-O2 -fopenmp" --target test_mcp_system
        if: ${{ github.event.pull_request.head.repo.fork }}
