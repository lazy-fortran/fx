name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + fpm test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fx
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran-14 gcc-14 curl nodejs python3 perl ruby
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/gfortran gfortran /usr/bin/gfortran-14 100
          gcc --version | head -1
          gfortran --version | head -1

      - name: Install fpm
        run: |
          sudo curl -L -o /usr/local/bin/fpm \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          sudo chmod +x /usr/local/bin/fpm
          fpm --version

      # FPM bootstraps the pinned native driver. The gate traces fo's build and
      # full test tree with a private PATH containing only native tools.
      - name: Bootstrap native fo driver
        run: |
          git clone https://github.com/lazy-fortran/fo.git "$RUNNER_TEMP/fo-src"
          git -C "$RUNNER_TEMP/fo-src" checkout 7f70a09e7afe1fadcd47ed5c47452826c035b3db
          cd "$RUNNER_TEMP/fo-src"
          fpm install --profile release --prefix "$RUNNER_TEMP/native-tools"

      - name: Run native no-interpreter acceptance gate
        env:
          FX_RUN_NO_INTERPRETER_GATE: "1"
          FX_FO_EXECUTABLE: ${{ runner.temp }}/native-tools/bin/fo
          FO_DISABLE_SELF_REFRESH: "1"
          FO_SELF_REFRESH: "0"
          FO_CACHE_DIR: ${{ runner.temp }}/fx-native-cache
        run: ${{ runner.temp }}/native-tools/bin/fo test test_no_interpreter_gate
