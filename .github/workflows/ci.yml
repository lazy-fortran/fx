name: CI

on:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-gfortran-12:
    name: build + test (gfortran-12)
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: 4
    steps:
      - name: Checkout fx
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run native compiler checks
        uses: ./.github/actions/native-checks
        with:
          compiler: gfortran-12

  build-test-gfortran-14:
    name: build + test (gfortran-14)
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: 4
    steps:
      - name: Checkout fx
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run native compiler checks
        uses: ./.github/actions/native-checks
        with:
          compiler: gfortran-14

  build-test-flang-21:
    name: build + test (flang-21)
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: 4
    steps:
      - name: Checkout fx
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run native compiler checks
        uses: ./.github/actions/native-checks
        with:
          compiler: flang-21
